name: DocMate 2.0 beta feedback
description: Report a bug, confusing workflow, performance problem, or useful product observation from TestFlight.
title: "[Beta 120] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing DocMate 2.0. Please do not upload private documents, signatures, IDs, financial statements, or confidential business files.
  - type: dropdown
    id: mission
    attributes:
      label: Area tested
      options:
        - Review / Sign / Save / Reopen
        - Scanner / Crop / Rotation / Filters
        - Compare / Review
        - iCloud sync
        - Search / Workspace / Activity
        - OCR / Export
        - Intelligence / Ask
        - Other
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: DocMate build
      value: "2.0.0 (120)"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: "Example: iPhone 18 Pro Max, iOS 27.2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Give the shortest exact sequence that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Often
        - Sometimes
        - Once
        - Not sure
    validations:
      required: true
  - type: textarea
    id: usability
    attributes:
      label: What felt confusing, slow, or unexpectedly good?
      description: Product feedback is just as useful as bug reports.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I confirm that any attachment I share is privacy-safe and contains no sensitive document or signature data.
          required: true
